  observed_reference_run:
    date: "2026-05-01"
    command_options: --top 3 --radius 1 --max-bridge-degree 10 --max-subgraph-activities 80
    top_labels:
      - inositol phosphate biosynthetic process
      - plasma membrane
      - endoplasmic reticulum membrane
      - myo-inositol import across plasma membrane
      - myo-inositol:proton symporter activity
