    neighborhood.
  value_notes: Synthetic signed magnitudes across transcriptomics, metabolomics, and semantic anchors.
context:
  taxon: NCBITaxon:4896
  species_label: Schizosaccharomyces pombe
  recommended_graph: .cache/gocam/full-megagraph.json
expected_answer:
