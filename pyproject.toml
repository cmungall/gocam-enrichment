[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gocam-enrichment"
version = "0.1.0"
description = "GO-CAM grounded network retrieval from mixed omics object lists"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gocam",
    "networkx>=3,<4",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "rich>=13,<15",
    "typer>=0.9,<1",
]

[project.scripts]
gocam-enrich = "gocam_enrichment.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv.sources]
gocam = { path = "../gocam", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/gocam_enrichment"]

[tool.pytest.ini_options]
testpaths = ["tests"]

